services:
  discord-music-bot:
    build: . # Build the Docker image from the current directory for development
    image: estessj/discord-music-bot
    container_name: discord-music-bot
    restart: unless-stopped
    volumes:
      - .:/app  # Mount the project directory to /app for source code access and development
      - ./logs:/app/logs  # Keep logs accessible on the host
    env_file:
      - .env
